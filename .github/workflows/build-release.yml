name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Keep in sync with the SDK used by build.bat (packages dir name).
      WEBVIEW2_VERSION: 1.0.2903.40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WebView2 SDK (NuGet)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory packages

      - name: Build (MSVC x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          build.bat

      - name: Package (zip)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "nightly" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\FullScreenBrowser.exe dist\
          Compress-Archive -Path dist\FullScreenBrowser.exe -DestinationPath "dist\FullScreenBrowser-$tag.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBrowser
          path: |
            dist/FullScreenBrowser.exe
            dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release (tagged)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            dist\FullScreenBrowser.exe `
            "dist\FullScreenBrowser-${{ github.ref_name }}.zip" `
            --repo "${{ github.repository }}" `
            --title "FullScreen Browser ${{ github.ref_name }}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update nightly release (branch push)
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          gh release create nightly `
            dist\FullScreenBrowser.exe `
            dist\FullScreenBrowser-nightly.zip `
            --repo "${{ github.repository }}" `
            --title "Nightly build ${{ github.sha }}" `
            --notes "Latest automatic build from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`." `
            --prerelease `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
