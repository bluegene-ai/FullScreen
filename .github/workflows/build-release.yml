name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Keep in sync with the SDK used by build.bat (packages dir name).
      WEBVIEW2_VERSION: 1.0.2903.40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WebView2 SDK (NuGet)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory packages

      - name: Build (MSVC x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          build.bat

      - name: Package (zip)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "ci" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\FullScreenBrowser.exe dist\
          Compress-Archive -Path dist\FullScreenBrowser.exe -DestinationPath "dist\FullScreenBrowser-$tag.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBrowser
          path: |
            dist/FullScreenBrowser.exe
            dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release (tagged only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            dist\FullScreenBrowser.exe `
            "dist\FullScreenBrowser-${{ github.ref_name }}.zip" `
            --repo "${{ github.repository }}" `
            --title "FullScreen Browser ${{ github.ref_name }}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
