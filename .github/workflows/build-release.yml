name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Keep in sync with the SDK used by build.bat (packages dir name).
      WEBVIEW2_VERSION: 1.0.2903.40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so the release notes can diff against the
          # previous release tag.
          fetch-depth: 0

      - name: Restore WebView2 SDK (NuGet)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory packages

      - name: Compute version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}"
          } else {
            # V<yyyy.MM.dd> plus a/b/c... suffix for multiple same-day builds.
            $base = "V" + (Get-Date -Format 'yyyy.MM.dd')
            $tags = @()
            try {
              $tags = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName 2>$null | ConvertFrom-Json | ForEach-Object { $_.tagName })
            } catch { $tags = @() }
            $idx = 0
            foreach ($t in $tags) {
              if ($t -eq $base) { $idx = [Math]::Max($idx, 1) }
              elseif ($t -like "$base?") {
                $n = [int][char]($t[$base.Length]) - 96
                $idx = [Math]::Max($idx, $n)
              }
            }
            $ver = if ($idx -eq 0) { $base } else { $base + [char](96 + $idx) }
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Release version: $ver"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (MSVC x64)
        shell: cmd
        run: |
          rem Inject the computed version into src/version.h (used by resource.rc).
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$v='${{ env.VERSION }}' -replace '^[Vv]',''; $nums=@([regex]::Matches($v,'\d+')|ForEach-Object{[int]$_.Value}); $am=[regex]::Match($v,'([a-z])$'); $bld=0; if($am.Success){$bld=[int][char]$am.Groups[1].Value-96}; $maj=if($nums.Count-ge 1){$nums[0]}else{0}; $min=if($nums.Count-ge 2){$nums[1]}else{0}; $pat=if($nums.Count-ge 3){$nums[2]}else{0}; if($nums.Count-ge 4){$bld=$nums[3]}; $str=if($bld-gt 0){'{0}.{1}.{2}.{3}' -f $maj,$min,$pat,$bld}else{'{0}.{1}.{2}' -f $maj,$min,$pat}; @('#pragma once',('#define APP_VERSION_MAJOR '+$maj),('#define APP_VERSION_MINOR '+$min),('#define APP_VERSION_PATCH '+$pat),('#define APP_VERSION_BUILD '+$bld),('#define APP_VERSION_STR '+[char]34+$str+[char]34),'#define APP_VERSION APP_VERSION_MAJOR, APP_VERSION_MINOR, APP_VERSION_PATCH, APP_VERSION_BUILD')|Set-Content -Path src\version.h -Encoding ascii"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          build.bat

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\FullScreenBrowser.exe dist\
          Compress-Archive -Path dist\FullScreenBrowser.exe -DestinationPath "dist\FullScreenBrowser-$env:VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: FullScreenBrowser
          path: |
            dist/FullScreenBrowser.exe
            dist/*.zip
          if-no-files-found: error

      - name: Generate release notes (中文更新要点)
        shell: pwsh
        run: |
          # Locate the previous release tag for a scoped changelog.
          $prev = $null
          try {
            $tags = @(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName 2>$null | ConvertFrom-Json | ForEach-Object { $_.tagName })
          } catch { $tags = @() }
          $prev = $tags | Where-Object { $_ -ne "$env:VERSION" } | Select-Object -First 1

          if ($prev) {
            $subjects = git log "$prev..HEAD" --pretty=format:%s 2>$null
          } else {
            $subjects = git log -20 --pretty=format:%s 2>$null
          }

          # Group by conventional-commit type; drop housekeeping commits.
          $groups = @{ feat = @(); fix = @(); docs = @(); other = @() }
          foreach ($line in @($subjects)) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $clean = $line.Trim()
            $type = 'other'; $body = $clean
            if ($clean -match '^feat(?:\([^)]*\))?[:：]\s*(.+)$')    { $type='feat';  $body=$Matches[1] }
            elseif ($clean -match '^fix(?:\([^)]*\))?[:：]\s*(.+)$')  { $type='fix';   $body=$Matches[1] }
            elseif ($clean -match '^docs(?:\([^)]*\))?[:：]\s*(.+)$') { $type='docs';  $body=$Matches[1] }
            elseif ($clean -match '^(?:chore|build|ci|test|style|refactor|perf)(?:\([^)]*\))?[:：]') { continue }
            if ($groups[$type] -notcontains $body) { $groups[$type] += $body }
          }

          $labels = @{ feat = '✨ 新增功能'; fix = '🐛 修复'; docs = '📝 文档'; other = '📌 其他' }
          $lines = @('## 主要更新', '')
          foreach ($t in @('feat','fix','docs','other')) {
            if ($groups[$t].Count -gt 0) {
              $lines += '### ' + $labels[$t]
              foreach ($b in $groups[$t]) { $lines += '- ' + $b }
              $lines += ''
            }
          }
          $lines += '> 自动构建：' + "${{ github.ref_name }}" + ' @ ' + "${{ github.sha }}"

          New-Item -ItemType Directory -Force dist | Out-Null
          $lines | Set-Content -Path dist\release-notes.md -Encoding utf8
          Write-Output 'Release notes:'
          Get-Content dist\release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: pwsh
        run: |
          gh release create "${{ env.VERSION }}" `
            dist\FullScreenBrowser.exe `
            "dist\FullScreenBrowser-${{ env.VERSION }}.zip" `
            --repo "${{ github.repository }}" `
            --title "FullScreen Browser ${{ env.VERSION }}" `
            --notes-file dist\release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
